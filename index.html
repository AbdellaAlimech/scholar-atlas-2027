<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scholar Atlas 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a graduation-stole band of academic hood colours tops a GPA matcher; faculties are hood-colour tiles;
   results are a sortable register where each scholarship shows its required GPA against yours. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --raise:#eef0f5; --ink:#14161f; --muted:#5b6170; --line:#d9dce5;
  --accent:#1f3c9a; --accent-ink:#ffffff; --accent-soft:#e2e8f8; --gold:#b98a1c; --gold-soft:#f6ecd2;
  --good:#1c7a46; --good-soft:#d9f0e2; --near:#9a6400; --near-soft:#f8ecd0; --bad:#b0392b; --bad-soft:#f8e0dc; --closed:#7a808c; --closed-soft:#e8eaef;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  /* academic hood colours (US Intercollegiate Code) */
  --h-ENG:#f07d1a; --h-CS:#56687e; --h-SCI:#e8b007; --h-MED:#2d8a3e; --h-HLT:#ef8a77; --h-AGR:#e3c55b; --h-ENV:#8e4b2c;
  --h-BUS:#9d8a5b; --h-LAW:#6b2d91; --h-SOC:#0f7e8e; --h-DEV:#c9c935; --h-EDU:#86c0e6; --h-HUM:#ffffff; --h-ART:#6e4429; --h-JRN:#a51b30;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1016; --surface:#161922; --raise:#1c202b; --ink:#e6e8ef; --muted:#9aa1b1; --line:#2a2f3c;
  --accent:#8ea8ff; --accent-ink:#0b1230; --accent-soft:#1d2645; --gold:#e3b54a; --gold-soft:#33290f;
  --good:#6fd39b; --good-soft:#163222; --near:#e8bb55; --near-soft:#33290f; --bad:#f08f80; --bad-soft:#3a1d19; --closed:#8b92a0; --closed-soft:#232733; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1016; --surface:#161922; --raise:#1c202b; --ink:#e6e8ef; --muted:#9aa1b1; --line:#2a2f3c;
  --accent:#8ea8ff; --accent-ink:#0b1230; --accent-soft:#1d2645; --gold:#e3b54a; --gold-soft:#33290f;
  --good:#6fd39b; --good-soft:#163222; --near:#e8bb55; --near-soft:#33290f; --bad:#f08f80; --bad-soft:#3a1d19; --closed:#8b92a0; --closed-soft:#232733; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stole{display:flex;height:10px}
.stole i{flex:1}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;gap:20px;align-items:center;padding-block:10px;overflow-x:auto;scrollbar-width:none}
nav.top .wrap::-webkit-scrollbar{display:none}
.brand{font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{color:var(--gold)}
nav.top a.l{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
nav.top a.l:hover{color:var(--ink)}

/* hero */
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:44px;padding-block:48px 56px;align-items:center}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(42px,6.4vw,78px);line-height:.95;letter-spacing:-.02em;margin:12px 0 18px;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:17.5px;color:var(--muted);max-width:50ch;margin:0 0 22px}
.facts{display:flex;gap:26px;flex-wrap:wrap}
.facts div b{display:block;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.facts div span{font-size:13px;color:var(--muted)}
.matcher{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 24px 60px -36px rgba(20,22,31,.45);min-width:0}
.matcher h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 4px}
.matcher p.s{margin:0 0 16px;color:var(--muted);font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
input[type=number],input[type=search],select{font:inherit;font-size:15px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.gparow{display:flex;gap:8px}
.gparow input{flex:1 1 0}.gparow select{flex:1.3 1 0}
.conv{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.conv b{color:var(--accent)}
.result{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.result .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--good);font-variant-numeric:tabular-nums}
.result .txt{font-size:14px;color:var(--muted);flex:1 1 180px}
.result .txt b{color:var(--ink)}
.btn{display:inline-flex;gap:8px;align-items:center;font:inherit;font-weight:600;font-size:15px;padding:11px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}

/* sections */
section{padding-block:56px 6px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sh h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.4vw,46px);line-height:1;margin:6px 0 0;letter-spacing:-.015em;text-wrap:balance}
.sh p{margin:0;color:var(--muted);max-width:54ch}

/* faculties */
.facs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.fac{font:inherit;text-align:left;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .15s,border-color .15s}
.fac:hover{transform:translateY(-2px);border-color:var(--ink)}
.fac[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hood{width:34px;height:22px;clip-path:polygon(0 0,100% 0,50% 100%);border:0}
.fac .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fac .n{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.fac h3{margin:0;font-size:14.5px;line-height:1.3}
.fac small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.hoodnote{font-size:13px;color:var(--muted);margin-top:12px}

/* closing soon */
.soon{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.sc:hover{border-color:var(--ink)}
.days{font-family:var(--mono);font-weight:600;font-size:12.5px;padding:2px 8px;border-radius:4px;align-self:flex-start;white-space:nowrap}
.d-urgent{background:var(--bad-soft);color:var(--bad)}.d-soon{background:var(--near-soft);color:var(--near)}.d-later{background:var(--accent-soft);color:var(--accent)}.d-closed{background:var(--closed-soft);color:var(--closed)}
.sc h3{margin:0;font-size:14.5px;line-height:1.35}
.sc span.c{font-size:12.5px;color:var(--muted)}

/* register */
.reg{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:clip}
.filters{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 45px);background:var(--surface);z-index:10}
.f1{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.chip{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{width:10px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.2)}
.toggles{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--muted)}
.bar2 strong{color:var(--ink)}
#list{display:flex;flex-direction:column}
details.s{border-bottom:1px solid var(--line);min-width:0}
details.s[open]{background:var(--raise)}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) 170px 150px;gap:16px;align-items:center}
summary::-webkit-details-marker{display:none}
.t{min-width:0}
.t h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font-size:12.5px;color:var(--muted);align-items:center}
.pill{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--raise);color:var(--ink);border:1px solid var(--line)}
.pill.full{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.part{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.who{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:9px;height:9px;border-radius:2px;border:1px solid rgba(0,0,0,.18)}
.gauge{min-width:0}
.gauge .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:4px}
.gauge .lbl b{color:var(--ink)}
.track{position:relative;height:8px;border-radius:4px;background:var(--raise);border:1px solid var(--line)}
.track .req{position:absolute;top:-1px;bottom:-1px;left:0;border-radius:4px 0 0 4px;background:color-mix(in srgb,var(--muted) 35%,transparent)}
.track .me{position:absolute;top:-5px;width:3px;height:16px;border-radius:2px;background:var(--accent);transform:translateX(-1px)}
.match{font-size:11.5px;font-weight:600;margin-top:5px}
.m-ok{color:var(--good)}.m-near{color:var(--near)}.m-no{color:var(--bad)}
.dl{text-align:right;min-width:0}
.dl .date{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:4px}
.body{padding:2px 16px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 24px;margin:0}
.f{min-width:0}.f.w2{grid-column:span 2}.f.w3{grid-column:1/-1}
.f dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:2px}
.f dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.f.tip dd{background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.star{font:inherit;font-size:13px;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--muted);cursor:pointer}
.star[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
.loadmore{display:flex;justify-content:center;padding:16px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;position:relative}
.step.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.step.past{opacity:.55}
.step .w{font-family:var(--mono);font-size:12.5px;color:var(--accent);font-weight:600}
.step h3{font-family:var(--display);font-weight:800;font-size:20px;margin:4px 0 6px}
.step p{margin:0;font-size:14px;color:var(--muted)}
.here{position:absolute;top:-10px;right:12px;font-family:var(--mono);font-size:11px;font-weight:600;background:var(--gold);color:#1d1400;padding:2px 8px;border-radius:4px}

/* gpa guide */
.guide{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.conv{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.conv th,table.conv td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.conv th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
table.conv tr:last-child td{border-bottom:0}
.bands{display:flex;flex-direction:column;gap:10px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.band b{font-family:var(--display);font-size:19px}
.band p{margin:4px 0 0;font-size:14px;color:var(--muted)}

/* tips */
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.tip h3{margin:0 0 6px;font-family:var(--display);font-weight:800;font-size:19px}
.tip p{margin:0;font-size:14.5px}

/* card actions */
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.act{font:inherit;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.act:hover{border-color:var(--ink)}
.act[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* compare tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.tray .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:10px;flex-wrap:wrap}
.tray .names{font-size:13.5px;min-width:0;flex:1 1 300px}
.tray button{font:inherit;font-weight:600;font-size:14px;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--bg);background:var(--bg);color:var(--ink)}
.tray button.ghost{background:transparent;color:var(--bg)}

/* banner */
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:20px}
.banner p{margin:0;font-size:14.5px}

/* plan */
.plan-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.plan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ptable{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ptable table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
.ptable th,.ptable td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.ptable th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ptable tr:last-child td{border-bottom:0}
.ptable select{padding:6px 8px;font-size:13.5px;width:auto}
.st-Won{color:var(--good);font-weight:700}.st-Rejected{color:var(--bad)}
.cmp{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:14px}
.cmp table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{width:150px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.cmp thead td{font-weight:700}

/* countries */
.ctry-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ctry-tools select{width:auto}
.ctry{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:8px}
.cc h3{margin:0;font-family:var(--display);font-weight:800;font-size:21px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cc h3 small{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:500}
.cc dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.cc dt{color:var(--muted)}.cc dd{margin:0}
.cc .go{font:inherit;font-size:13px;align-self:flex-start;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600}

/* essay */
.essay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.eform{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.eform textarea,.eform input{font:inherit;font-size:14.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;resize:vertical}
.eout{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:70px}
.eout pre{white-space:pre-wrap;font-family:var(--body);font-size:14.5px;line-height:1.6;margin:0 0 12px;max-height:60vh;overflow:auto}
.eout .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:13px;color:var(--muted)}
@media (max-width:1000px){.plan-top{grid-template-columns:repeat(2,minmax(0,1fr))}.ctry{grid-template-columns:repeat(2,minmax(0,1fr))}.essay{grid-template-columns:1fr}.eout{position:static}}
@media (max-width:640px){.ctry{grid-template-columns:1fr}}

footer{margin-top:64px;border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:26px 40px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;font-size:13.5px;color:var(--muted)}
footer b{color:var(--ink)}

@media (max-width:1000px){
  .hero .wrap{grid-template-columns:1fr;gap:30px}
  .facs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .soon,.tl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f1{grid-template-columns:repeat(2,minmax(0,1fr))}.f1 #q{grid-column:1/-1}
  summary{grid-template-columns:minmax(0,1fr) 150px}
  summary .dl{grid-column:1/-1;text-align:left;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .guide{grid-template-columns:1fr}.tips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .body{grid-template-columns:repeat(2,minmax(0,1fr))}.f.w2{grid-column:1/-1}
}
@media (max-width:640px){
  .facs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .soon,.tl,.tips,.mgrid{grid-template-columns:1fr}
  summary{grid-template-columns:1fr}
  .filters{position:static}
  .body{grid-template-columns:1fr}
  footer .wrap{grid-template-columns:1fr}
}

<script src="i18n.js?v=3"></script>
<script>
const TODAY=new Date();
const FACS=["ENG","CS","SCI","MED","HLT","AGR","ENV","BUS","LAW","SOC","DEV","EDU","HUM","ART","JRN"];
const FROM=[["Africa","oAfrica"],["Asia","oAsia"],["Latin America & Caribbean","oLatam"],["Middle East & North Africa","oMena"],["Europe","oEurope"],["North America","oNam"],["Oceania","oOce"]];
const PATHD=[["2026-09-01","2026-10-31"],["2026-11-01","2026-12-31"],["2027-01-01","2027-01-31"],["2027-02-01","2027-03-31"],["2027-04-01","2027-06-30"],["2027-06-01","2027-08-31"],["2027-08-01","2027-10-31"],["2027-09-01","2027-10-31"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const hood=c=>`var(--h-${c})`;

/* ---------- language ---------- */
let LANG=store.get("sa-lang",null)||((navigator.language||"en").slice(0,2).match(/fr|tr/)||["en"])[0];
const LOC={en:"en-GB",fr:"fr-FR",tr:"tr-TR"};
function T(k,...a){let s=(I18N[LANG]&&I18N[LANG][k]!==undefined&&I18N[LANG][k]!=="")?I18N[LANG][k]:I18N.en[k];if(typeof s!=="string")return s;return s.replace(/\{(\d)\}/g,(m,i)=>a[i]??"")}
const facName=c=>T("fac")[c]||I18N.en.fac[c];
const facShort=c=>T("facShort")[c]||I18N.en.facShort[c];
const whoName=w=>T("who")[w]||I18N.en.who[w];
const ctryName=c=>(I18N[LANG].country&&I18N[LANG].country[c])||c;
const regName=r=>(I18N[LANG].region&&I18N[LANG].region[r])||r;
const num=x=>x.toLocaleString(LOC[LANG],{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=(d,o)=>d.toLocaleDateString(LOC[LANG],o);
function applyStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T(e.dataset.t));
  document.querySelectorAll("[data-th]").forEach(e=>e.innerHTML=T(e.dataset.th));
  document.querySelectorAll("[data-tp]").forEach(e=>e.placeholder=T(e.dataset.tp));
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
}

$("stole").innerHTML=FACS.map(c=>`<i style="background:${hood(c)}"></i>`).join("");
document.querySelectorAll(".fromSel").forEach(s=>s.insertAdjacentHTML("beforeend",FROM.map(([v,k])=>`<option value="${esc(v)}" data-t="${k}"></option>`).join("")));
$("mFac").insertAdjacentHTML("beforeend",FACS.map(c=>`<option value="${c}" class="facOpt" data-f="${c}"></option>`).join(""));

/* ---------- GPA ---------- */
function lerp(t,x){if(x>=t[0][0])return t[0][1];for(let i=1;i<t.length;i++){if(x>=t[i][0]){const [a,ya]=t[i-1],[b,yb]=t[i];return yb+(x-b)*(ya-yb)/(a-b)}}return t[t.length-1][1]}
function toGPA(v,s){
  if(!isFinite(v))return null;
  if(s==="uk")return v<=1?3.8:v<=2?3.3:v<=3?2.7:2.2;
  const n=+s;
  if(n===10)return lerp([[9,4],[8.5,3.7],[7.7,3.3],[7,3],[6.4,2.7],[5.8,2.3],[5,2],[4,1.5]],v);
  if(n===20)return lerp([[16,4],[14,3.7],[13,3.3],[12,3],[11,2.7],[10,2.3],[9.5,2],[8,1.5]],v);
  if(n===100)return lerp([[90,4],[85,3.7],[80,3.3],[75,3],[70,2.7],[65,2.3],[60,2],[50,1.5]],v);
  return Math.min(4,v*4/n);
}
let MYGPA=null;
function readGPA(){
  const v=parseFloat($("gpaIn").value),s=$("scale").value;
  MYGPA=toGPA(v,s); if(MYGPA!=null)MYGPA=Math.max(0,Math.min(4,MYGPA));
  $("convOut").innerHTML=MYGPA==null?T("convEnter"):T("conv",num(MYGPA));
  $("myg").textContent=MYGPA==null?"":T("myGpa",num(MYGPA));
  store.set("sa-gpa",{v:$("gpaIn").value,s});
}
function matchOf(r){if(MYGPA==null)return"";return MYGPA>=r.gpa?"ok":MYGPA>=r.gpa-0.2?"near":"no"}

const DEVREG=["Africa","Asia","Latin America & Caribbean","Middle East & North Africa"];
function fromOK(r,from){
  if(!from)return true;const w=r.who;
  if(w.some(x=>["ALL","WOMEN","REF","COMM","OIC"].includes(x)))return true;
  if(w.includes("AFR")&&(from==="Africa"||from==="Middle East & North Africa"))return true;
  if(w.includes("ASIA")&&(from==="Asia"||from==="Middle East & North Africa"))return true;
  if(w.includes("LATAM")&&from==="Latin America & Caribbean")return true;
  if(w.includes("DEV")&&DEVREG.includes(from))return true;
  return false;
}
const DAY=864e5;
function dlInfo(r){
  const d=new Date(r.dl+"T23:59:59"),days=Math.ceil((d-TODAY)/DAY);
  const fmt=fmtDate(d,{day:"numeric",month:"short",year:"numeric"});
  if(days<0){const nx=new Date(d);nx.setFullYear(nx.getFullYear()+1);return{days,cls:"d-closed",txt:T("closed"),sub:T("nextRound",fmtDate(nx,{month:"short",year:"numeric"})),closed:true}}
  if(days<=30)return{days,cls:"d-urgent",txt:days===0?T("today"):days===1?T("inDay"):T("inDays",days),sub:"~"+fmt};
  if(days<=90)return{days,cls:"d-soon",txt:T("daysLeft",days),sub:"~"+fmt};
  return{days,cls:"d-later",txt:T("later"),sub:"~"+fmt};
}
const hasFac=(r,f)=>!f||r.fields.includes("ALL")||r.fields.includes(f);
const hasLv=(r,l)=>!l||r.lv.includes(l);
const tx=(r,f)=>(LANG!=="en"&&r.i18n&&r.i18n[LANG]&&r.i18n[LANG][f])||r[f]||"";
const fundTxt=r=>r.fund==="Full"?T("full"):r.fund==="Tuition"?T("tuition"):T("partial");
const lvTxt=r=>r.lv.split("").map(x=>T(x)).join(" · ");

let DATA=[],fac="",shown=30,saved=new Set(store.get("sa-saved",[])),onlyIds=null;

function matcherCount(){
  if(!DATA.length)return;
  const l=$("mLevel").value,f=$("mFac").value,from=$("mFrom").value;
  const pool=DATA.filter(r=>hasLv(r,l)&&hasFac(r,f)&&fromOK(r,from)&&!dlInfo(r).closed);
  const ok=pool.filter(r=>MYGPA!=null&&MYGPA>=r.gpa);
  $("mCount").textContent=ok.length;
  $("mTxt").innerHTML=T("mResult",pool.length,ok.filter(r=>dlInfo(r).days<=60).length);
  store.set("sa-match",{l,f,from});
}
function goBrowse(){$("fLevel").value=$("mLevel").value;$("fFrom").value=$("mFrom").value;setFac($("mFac").value);$("tMeet").checked=true;$("sort").value="match";onlyIds=null;reset();$("browse").scrollIntoView()}

function filtered(){
  const q=$("q").value.trim().toLowerCase(),reg=$("fRegion").value,l=$("fLevel").value,from=$("fFrom").value;
  let res=DATA.filter(r=>{
    if(onlyIds)return onlyIds.has(r.id);
    if(!hasFac(r,fac)||!hasLv(r,l)||!fromOK(r,from))return false;
    if(reg&&r.region!==reg)return false;
    if($("tFull").checked&&r.fund!=="Full")return false;
    if($("tOpen").checked&&dlInfo(r).closed)return false;
    if($("tSaved").checked&&!saved.has(r.id))return false;
    if($("tMeet").checked&&MYGPA!=null&&MYGPA<r.gpa)return false;
    if(q){const h=(r.name+" "+r.country+" "+ctryName(r.country)+" "+r.provider+" "+r.cov+" "+r.tips+" "+r.lang+" "+tx(r,"cov")+" "+tx(r,"tips")+" "+r.fields.map(f=>f==="ALL"?T("allFacs"):facName(f)+" "+I18N.en.fac[f]).join(" ")+" "+r.who.map(whoName).join(" ")).toLocaleLowerCase(LOC[LANG]);
      if(!q.split(/\s+/).every(w=>h.includes(w.toLocaleLowerCase(LOC[LANG]))))return false}
    return true});
  const s=$("sort").value,dk=r=>{const i=dlInfo(r);return i.closed?1e6-i.days:i.days},fr=r=>r.fund==="Full"?0:1;
  if(s==="dl")res.sort((a,b)=>dk(a)-dk(b));
  else if(s==="gpaAsc")res.sort((a,b)=>a.gpa-b.gpa||dk(a)-dk(b));
  else if(s==="gpaDesc")res.sort((a,b)=>b.gpa-a.gpa||dk(a)-dk(b));
  else if(s==="name")res.sort((a,b)=>a.name.localeCompare(b.name));
  else{const mr={ok:0,near:1,no:2,"":0};res.sort((a,b)=>mr[matchOf(a)]-mr[matchOf(b)]||fr(a)-fr(b)||dk(a)-dk(b))}
  return res;
}
const dots=r=>r.fields.includes("ALL")?`<span class="dots">${FACS.map(c=>`<i style="background:${hood(c)};width:4px;border-radius:0;border:0;height:10px"></i>`).join("")}</span> ${T("allFacs")}`
  :`<span class="dots">${r.fields.map(f=>`<i style="background:${hood(f)}" title="${esc(facName(f))}"></i>`).join("")}</span> ${r.fields.slice(0,3).map(f=>esc(facName(f))).join(", ")}${r.fields.length>3?" +"+(r.fields.length-3):""}`;
function gauge(r){
  const p=x=>Math.max(0,Math.min(100,(x-2)/2*100)),m=matchOf(r);
  const mt=m==="ok"?`<div class="match m-ok">${T("meets")}</div>`:m==="near"?`<div class="match m-near">${T("near")}</div>`:m==="no"?`<div class="match m-no">${T("below")}</div>`:"";
  return `<div class="gauge"><div class="lbl"><span>${r.gb==="O"?T("min"):T("typical")}</span><b>${num(r.gpa)}</b></div>
   <div class="track"><span class="req" style="width:${p(r.gpa)}%"></span>${MYGPA!=null?`<span class="me" style="left:${p(MYGPA)}%"></span>`:""}</div>${mt}</div>`;
}
const fld=(l,v,c="")=>`<div class="f ${c}"><dt>${l}</dt><dd>${v}</dd></div>`;
function card(r){
  const d=dlInfo(r),who=r.who.filter(w=>w!=="ALL").map(w=>`<span class="pill who">${esc(whoName(w))}</span>`).join("");
  return `<details class="s"><summary>
   <div class="t"><h3>${esc(r.name)}</h3><div class="meta"><span>${esc(ctryName(r.country))}</span><span>${lvTxt(r)}</span>
     <span class="pill ${r.fund==="Full"?"full":"part"}">${fundTxt(r)}</span>${who}</div><div class="meta">${dots(r)}</div></div>
   ${gauge(r)}<div class="dl"><span class="days ${d.cls}">${d.txt}</span><div class="date">${esc(d.sub)}</div></div>
  </summary><dl class="body">
      ${fld(T("dCov"),esc(tx(r,"cov")),"w2")}${fld(T("dWho"),r.who.map(w=>esc(whoName(w))).join(", "))}
   ${fld(T("dGpa"),`${num(r.gpa)} / 4.0 · ${r.gb==="O"?T("gOff"):T("gEst")}`)}${fld(T("dLang"),esc(tx(r,"lang")))}${fld(T("dWin"),esc(tx(r,"win")))}
   ${fld(T("dProv"),esc(r.provider)+" · "+esc(tx(r,"type")))}${fld(T("dWeb"),`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url.replace(/^https?:\/\//,""))}</a>`,"w2")}
   ${fld(T("dTips"),esc(tx(r,"tips"))+(r.note?" "+esc(tx(r,"note")):""),"w3 tip")}
   <div class="acts">
     <button class="star" type="button" data-star="${r.id}" aria-pressed="${saved.has(r.id)}">${saved.has(r.id)?T("saveOn"):T("saveOff")}</button>
     <button class="act" type="button" data-cmp="${r.id}" aria-pressed="${cmp.has(r.id)}">${cmp.has(r.id)?T("cmpOn"):T("cmpOff")}</button>
     <button class="act" type="button" data-ics="${r.id}">${T("ics")}</button>
     <a class="act" href="${gcal(r)}" target="_blank" rel="noopener">${T("gcal")}</a>
   </div></dl></details>`;
}
function render(){
  const res=filtered();
  $("count").innerHTML=T("count",res.length,DATA.length,res.filter(r=>r.fund==="Full").length)+(saved.size?T("countSaved",saved.size):"")+(onlyIds?T("sharedOn")+` <button class="act" type="button" id="clearShared">${T("showAll")}</button>`:"");
  const cs=$("clearShared");if(cs)cs.onclick=()=>{onlyIds=null;$("tOpen").checked=true;reset()};
  $("list").innerHTML=res.length?res.slice(0,shown).map(card).join(""):`<div class="empty">${T("empty")}</div>`;
  $("more").hidden=res.length<=shown;$("more").textContent=T("more",Math.min(30,res.length-shown),res.length-shown);
}
function reset(){shown=30;render()}
function setFac(v){fac=v||"";$("facChips").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===fac));
  [...$("facGrid").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===fac&&fac!==""))}

/* ---------- calendar ---------- */
const byId=id=>DATA.find(r=>r.id===id);
function nextDL(r){const d=new Date(r.dl+"T12:00:00");if(d<TODAY)d.setFullYear(d.getFullYear()+1);return d}
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
const icsEsc=s=>String(s).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
function gcal(r){const d=nextDL(r),e=new Date(d);e.setDate(e.getDate()+1);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(T("icsTitle",r.name))+"&dates="+ymd(d)+"/"+ymd(e)+"&details="+encodeURIComponent(T("icsDesc",r.url))}
function downloadICS(rows){
  rows=rows.filter(Boolean);if(!rows.length)return;
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const ev=rows.map(r=>{const d=nextDL(r),e=new Date(d);e.setDate(e.getDate()+1);return ["BEGIN:VEVENT","UID:sa2027-"+r.id+"-"+ymd(d)+"@scholar-atlas","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ymd(d),"DTEND;VALUE=DATE:"+ymd(e),
    "SUMMARY:"+icsEsc(T("icsTitle",r.name)),"DESCRIPTION:"+icsEsc(T("icsDesc",r.url)),"URL:"+r.url,
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(T("ics14",r.name)),"TRIGGER:-P14D","END:VALARM",
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(T("ics3",r.name)),"TRIGGER:-P3D","END:VALARM","END:VEVENT"].join("\r\n")}).join("\r\n");
  const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Scholar Atlas 2027//EN","CALSCALE:GREGORIAN",ev,"END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));
  a.download=rows.length===1?"deadline-"+rows[0].id+".ics":"my-scholarship-deadlines.ics";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- compare ---------- */
const cmp=new Set();
function toggleCmp(id){if(cmp.has(id))cmp.delete(id);else{if(cmp.size>=3)cmp.delete([...cmp][0]);cmp.add(id)}updateTray()}
function updateTray(){$("tray").hidden=cmp.size===0;$("trayNames").textContent=T("trayTxt",cmp.size)+[...cmp].map(id=>byId(id).name.split(/[–(]/)[0].trim()).join(" · ");
  $("list").querySelectorAll("[data-cmp]").forEach(b=>{const on=cmp.has(+b.dataset.cmp);b.setAttribute("aria-pressed",on);b.textContent=on?T("cmpOn"):T("cmpOff")})}
function renderCmp(){
  const rs=[...cmp].map(byId);if(!rs.length){$("cmpWrap").innerHTML="";return}
  const row=(l,fn)=>`<tr><th>${l}</th>${rs.map(r=>`<td>${fn(r)}</td>`).join("")}</tr>`;
  $("cmpWrap").innerHTML=`<h3 style="font-family:var(--display);font-size:24px;margin:26px 0 0">${T("cmpTitle")}</h3><div class="cmp"><table><thead><tr><th></th>${rs.map(r=>`<td>${esc(r.name)}</td>`).join("")}</tr></thead><tbody>
   ${row(T("cCountry"),r=>esc(ctryName(r.country)))}${row(T("cLevels"),r=>lvTxt(r))}${row(T("cFund"),fundTxt)}${row(T("cCov"),r=>esc(tx(r,"cov")))}
   ${row(T("cGpa"),r=>`${num(r.gpa)} (${r.gb==="O"?T("official"):T("typ")})${MYGPA!=null?(MYGPA>=r.gpa?" ✓":" ✗"):""}`)}
   ${row(T("cDl"),r=>{const d=dlInfo(r);return esc(d.txt+" · "+d.sub)})}${row(T("cWho"),r=>r.who.map(w=>esc(whoName(w))).join(", "))}
   ${row(T("cLang"),r=>esc(tx(r,"lang")))}${row(T("cFac"),r=>r.fields.includes("ALL")?T("allFacs"):r.fields.map(x=>esc(facName(x))).join(", "))}
   ${row(T("cWeb"),r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${T("offSite")}</a>`)}</tbody></table></div>`;
}
$("trayGo").onclick=()=>{renderCmp();$("cmpWrap").scrollIntoView()};
$("trayClear").onclick=()=>{cmp.clear();updateTray();renderCmp()};

/* ---------- my plan ---------- */
const STATUSES=["Not started","Preparing","Submitted","Interview","Won","Rejected"];
let status=store.get("sa-status",{});
const DONE=["Submitted","Interview","Won","Rejected"];
function renderPlan(){
  const rs=[...saved].map(byId).filter(Boolean).sort((a,b)=>nextDL(a)-nextDL(b)),stl=T("st");
  $("kSaved").textContent=rs.length;
  const open=rs.filter(r=>!dlInfo(r).closed&&!DONE.includes(status[r.id]));
  $("kNext").textContent=open.length?Math.max(0,dlInfo(open[0]).days):"–";
  $("kSub").textContent=rs.filter(r=>DONE.includes(status[r.id])).length;
  $("kWon").textContent=rs.filter(r=>status[r.id]==="Won").length;
  $("planBody").innerHTML=rs.length?rs.map(r=>{const d=dlInfo(r),s=status[r.id]||"Not started";
    return `<tr><td><b>${esc(r.name)}</b><div class="small">${esc(ctryName(r.country))} · ${fundTxt(r)}</div></td>
      <td><span class="days ${d.cls}">${d.txt}</span><div class="small">${esc(d.sub)}</div></td><td>${num(r.gpa)}</td>
      <td><select data-status="${r.id}" class="st-${s.replace(" ","")}" aria-label="${T("thSt")}">${STATUSES.map((x,i)=>`<option value="${x}"${x===s?" selected":""}>${stl[i]}</option>`).join("")}</select></td>
      <td style="white-space:nowrap"><button class="act" type="button" data-ics="${r.id}" aria-label="${T("ics")}">📅</button> <button class="act" type="button" data-unsave="${r.id}" aria-label="${T("remove")}">✕</button></td></tr>`}).join("")
    :`<tr><td colspan="5" class="small" style="padding:18px">${T("planEmpty")}</td></tr>`;
}
$("planBody").addEventListener("change",e=>{const s=e.target.closest("[data-status]");if(!s)return;status[s.dataset.status]=s.value;store.set("sa-status",status);renderPlan()});
$("planBody").addEventListener("click",e=>{const i=e.target.closest("[data-ics]");if(i){downloadICS([byId(+i.dataset.ics)]);return}
  const u=e.target.closest("[data-unsave]");if(u){saved.delete(+u.dataset.unsave);store.set("sa-saved",[...saved]);renderPlan();render()}});
$("icsAll").onclick=()=>{const rs=[...saved].map(byId);if(!rs.length){$("shareMsg").textContent=T("saveFirst");return}downloadICS(rs)};
$("shareBtn").onclick=async()=>{
  if(!saved.size){$("shareMsg").textContent=T("saveFirst");return}
  const url=location.origin+location.pathname+"#shortlist="+[...saved].join(".");
  try{await navigator.clipboard.writeText(url);$("shareMsg").textContent=T("copied")}catch(e){$("shareMsg").textContent=url}
};

/* ---------- shared lists ---------- */
let SHARED=null;
function readShared(){
  const m=location.hash.match(/^#shortlist=([\d.]+)/);if(!m)return;
  const ids=m[1].split(".").map(Number).filter(id=>byId(id));if(!ids.length)return;
  SHARED=ids;$("sharedBanner").hidden=false;$("sharedTxt").innerHTML=T("sharedTxt",ids.length);
  $("sharedShow").onclick=()=>{onlyIds=new Set(ids);$("tOpen").checked=false;$("tMeet").checked=false;setFac("");$("q").value="";reset();$("browse").scrollIntoView()};
  $("sharedAdd").onclick=()=>{ids.forEach(id=>saved.add(id));store.set("sa-saved",[...saved]);renderPlan();render();$("sharedAdd").textContent=T("added");$("plan").scrollIntoView()};
}

/* ---------- countries ---------- */
function renderCountries(){
  const s=$("cSort").value;let list=[...CTRY];
  if(s==="live")list.sort((a,b)=>a[1]-b[1]);else if(s==="psw")list.sort((a,b)=>b[2]-a[2]);else list.sort((a,b)=>ctryName(a[0]).localeCompare(ctryName(b[0]),LOC[LANG]));
  $("ctryGrid").innerHTML=list.map(c=>{const x=c[3][LANG]||c[3].en,n=DATA.filter(r=>r.country===c[0]).length;
    return `<div class="cc"><h3>${esc(ctryName(c[0]))}<small>${T("perMonth",c[1].toLocaleString(LOC[LANG]))}</small></h3><dl>
     <dt>${T("cTuition")}</dt><dd>${esc(x[0])}</dd><dt>${T("cWork")}</dt><dd>${esc(x[1])}</dd><dt>${T("cAfter")}</dt><dd>${esc(x[2])}</dd><dt>${T("cLangs")}</dt><dd>${esc(x[3])}</dd></dl>
     <div class="small">${esc(x[4])}</div>${n?`<button class="go" type="button" data-country="${esc(c[0])}">${T("cSee",n,esc(ctryName(c[0])))}</button>`:""}</div>`}).join("");
}
$("cSort").addEventListener("change",renderCountries);
$("ctryGrid").addEventListener("click",e=>{const b=e.target.closest("[data-country]");if(!b)return;$("q").value=b.dataset.country;setFac("");$("fRegion").value="";$("tMeet").checked=false;onlyIds=null;reset();$("browse").scrollIntoView()});

/* ---------- letter builder ---------- */
const EF=["e1","e2","e3","e4","e5","e6","e7","e8"];
function buildLetter(){
  const v=Object.fromEntries(EF.map(k=>[k,($(k).value||"").trim()]));store.set("sa-essay",v);
  if(LANG==="en")["e7","e8"].forEach(k=>{if(v[k])v[k]=v[k].replace(/^(I |to )/i,"").replace(/^./,c=>c.toLowerCase())});
  if(LANG==="fr")["e7","e8"].forEach(k=>{if(v[k])v[k]=v[k].replace(/^(j'ai |de )/i,"").replace(/^./,c=>c.toLowerCase())});
  const PH={e1:"ph2",e2:"ph3",e3:"ph1",e4:"ph4",e5:"ph5",e6:"ph6",e7:"ph7",e8:"ph8"};
  const vals=EF.map(k=>v[k]||`[${T(PH[k])}]`);
  const t=T("letter",null,...vals);
  $("eText").textContent=t;$("eWords").textContent=T("words",t.split(/\s+/).filter(Boolean).length);
}
EF.forEach(k=>$(k).addEventListener("input",buildLetter));
$("eCopy").onclick=async()=>{try{await navigator.clipboard.writeText($("eText").textContent);$("eMsg").textContent=T("eCopied")}catch(e){const r=document.createRange();r.selectNodeContents($("eText"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("eMsg").textContent=T("eSelected")}};

/* ---------- language-dependent pieces ---------- */
function renderStaticLists(){
  document.querySelectorAll(".facOpt").forEach(o=>o.textContent=facName(o.dataset.f));
  $("facChips").innerHTML=`<span class="lab">${T("facLabel")}</span><button class="chip" type="button" data-f="" aria-pressed="${fac===""}">${T("all")}</button>`+FACS.map(c=>`<button class="chip" type="button" data-f="${c}" aria-pressed="${fac===c}"><span class="sw" style="background:${hood(c)}"></span>${esc(facShort(c))}</button>`).join("");
  $("tl").innerHTML=T("path").map(([w,h,t],i)=>{const S=new Date(PATHD[i][0]),E=new Date(PATHD[i][1]+"T23:59:59"),c=E<TODAY?"past":S<=TODAY?"now":"";
    return `<div class="step ${c}">${c==="now"?`<span class="here">${T("here")}</span>`:""}<div class="w">${esc(w)}</div><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`}).join("");
  $("tipGrid").innerHTML=T("tips").map(([h,t])=>`<div class="tip"><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`).join("");
  if(DATA.length){
    const cur=$("fRegion").value;
    $("fRegion").innerHTML=`<option value="">${T("allDest")}</option>`+[...new Set(DATA.map(r=>r.region))].sort().map(x=>`<option value="${esc(x)}"${x===cur?" selected":""}>${esc(regName(x))}</option>`).join("");
    $("facGrid").innerHTML=FACS.map(c=>{const k=DATA.filter(r=>hasFac(r,c)).length,spec=DATA.filter(r=>r.fields.includes(c)).length;
      return `<button class="fac" type="button" data-f="${c}" aria-pressed="${fac===c}"><span class="top"><span class="hood" style="background:${hood(c)};${c==="HUM"?"outline:1px solid var(--line)":""}"></span><span class="n">${k}</span></span><h3>${esc(facName(c))}</h3><small>${T("facSpec",spec)}</small></button>`}).join("");
    const soon=DATA.map(r=>({r,i:dlInfo(r)})).filter(x=>!x.i.closed).sort((a,b)=>a.i.days-b.i.days).slice(0,8);
    $("soonGrid").innerHTML=soon.map(({r,i})=>`<div class="sc" role="button" tabindex="0" data-q="${esc(r.name.split(/[–(]/)[0].trim())}"><span class="days ${i.cls}">${i.txt}</span><h3>${esc(r.name)}</h3><span class="c">${esc(ctryName(r.country))} · ${fundTxt(r)} · ${T("dGpa")} ${num(r.gpa)}</span></div>`).join("");
  }
}
function setLang(l){
  LANG=I18N[l]?l:"en";store.set("sa-lang",LANG);
  applyStatic();readGPA();renderStaticLists();buildLetter();
  if(DATA.length){matcherCount();render();renderPlan();renderCountries();updateTray();renderCmp();if(SHARED)$("sharedTxt").innerHTML=T("sharedTxt",SHARED.length)}
}

/* ---------- events ---------- */
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
["gpaIn","scale"].forEach(id=>$(id).addEventListener("input",()=>{readGPA();matcherCount();render()}));
["mLevel","mFac","mFrom"].forEach(id=>$(id).addEventListener("change",matcherCount));
$("q").addEventListener("input",()=>{onlyIds=null;reset()});
["sort","fRegion","fLevel","fFrom","tMeet","tFull","tOpen","tSaved"].forEach(id=>$(id).addEventListener("change",reset));
$("more").onclick=()=>{shown+=30;render()};
$("facChips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){setFac(b.dataset.f);onlyIds=null;reset()}});
$("list").addEventListener("click",e=>{
  const c=e.target.closest("[data-cmp]");if(c){e.preventDefault();toggleCmp(+c.dataset.cmp);return}
  const i=e.target.closest("[data-ics]");if(i){e.preventDefault();downloadICS([byId(+i.dataset.ics)]);return}
  const b=e.target.closest("[data-star]");if(!b)return;e.preventDefault();
  const id=+b.dataset.star;saved.has(id)?saved.delete(id):saved.add(id);store.set("sa-saved",[...saved]);
  b.setAttribute("aria-pressed",saved.has(id));b.textContent=saved.has(id)?T("saveOn"):T("saveOff");renderPlan();if($("tSaved").checked)render()});
$("facGrid").addEventListener("click",e=>{const b=e.target.closest(".fac");if(!b)return;setFac(b.dataset.f);$("mFac").value=b.dataset.f;onlyIds=null;matcherCount();reset();$("browse").scrollIntoView()});
function soonGo(e){const c=e.target.closest(".sc");if(!c)return;$("q").value=c.dataset.q;setFac("");$("tMeet").checked=false;$("fRegion").value="";onlyIds=null;reset();$("browse").scrollIntoView()}
$("soonGrid").addEventListener("click",soonGo);
$("soonGrid").addEventListener("keydown",e=>{if(e.key==="Enter")soonGo(e)});

/* ---------- start ---------- */
const g=store.get("sa-gpa",null);if(g){$("gpaIn").value=g.v;$("scale").value=g.s}
const mm=store.get("sa-match",null);if(mm){$("mLevel").value=mm.l;$("mFac").value=mm.f;$("mFrom").value=mm.from}
const ev=store.get("sa-essay",null);if(ev)EF.forEach(k=>{if(ev[k])$(k).value=ev[k]});
setLang(LANG);

fetch("scholarships.json?v=3").then(r=>r.json()).then(d=>{
  DATA=d;
  $("fTotal").textContent=d.length;$("fFull").textContent=d.filter(r=>r.fund==="Full").length;$("fOpen").textContent=d.filter(r=>!dlInfo(r).closed).length;
  renderStaticLists();matcherCount();render();renderPlan();renderCountries();readShared();
}).catch(()=>{$("count").textContent=T("loadErr")});
</script>
